<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة محمود باك</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #0757a0;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            font-size: 18px;
            margin-top: 10px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 15px;
        }

        .branch {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .branch h2 {
            color: #0757a0;
            margin-top: 0;
        }

        .lesson {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-top: 12px;
            background: #f1f5f9;
            border-radius: 12px;
        }

        .lesson span {
            font-weight: bold;
        }

        .watch {
            background: #0757a0;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
        }

        .watch:hover {
            background: #063f75;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 مكتبة محمود باك</h1>
    <p>منصتك التعليمية لرحلة تعلم أفضل 🚀</p>
</header>

<div class="container">

    <!-- فرع البرمجة -->
    <div class="branch">
        <h2>💻 فرع البرمجة</h2>

        <div class="lesson">
            <span>🎥 الدرس الأول</span>

            <a class="watch"
               href="https://youtu.be/pqwRmKuYc58?si=2V02YLp0vkAcs1Qz"
               target="_blank">
                ▶️ مشاهدة الشرح
            </a>
        </div>
    </div>

    <!-- فرع العربي -->
    <div class="branch">
        <h2>📚 فرع العربي</h2>

        <div class="lesson">
            <span>🎥 الدرس الأول</span>

            <a class="watch"
               href="https://youtu.be/1l6-MzGJ5DA?si=5A00OGEZCvavP25b"
               target="_blank">
                ▶️ مشاهدة الشرح
            </a>
        </div>

        <div class="lesson">
            <span>🎥 الدرس الثاني</span>

            <a class="watch"
               href="https://youtu.be/xpndcdEmJVs?si=N0bwX51lXqCec4l9"
               target="_blank">
                ▶️ مشاهدة الشرح
            </a>
        </div>
    </div>

</div>

<footer>
    © 2026 مكتبة محمود باك
</footer>

</body>
</html>
